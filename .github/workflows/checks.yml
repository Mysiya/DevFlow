name: DevFlow checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Run isolated backend regression
        run: python -m pytest backend/tests -q -rs

  frontend:
    name: Frontend and Android URL policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check TypeScript and mobile offline policy
        working-directory: frontend
        run: |
          npm run typecheck
          npm run test:mobile
      - name: Verify Android HTTPS address policy
        run: |
          mkdir -p artifacts/android-policy-tests
          javac --release 17 -encoding UTF-8 -d artifacts/android-policy-tests mobile/android/app/src/main/java/com/mysiya/devflow/ServerAddress.java mobile/android/tests/ServerAddressTest.java
          java -cp artifacts/android-policy-tests ServerAddressTest
